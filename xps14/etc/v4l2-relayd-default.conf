# Built-in camera (Intel IPU7 / ov08x40). The sensor is mounted upside-down (the kernel
# reports V4L2_CID_CAMERA_SENSOR_ROTATION = 180), but from the 7.0.0-38 ov08x40 driver
# the image comes out upright with no flip at all. Do NOT add flip-mode=vhflip back:
# icamerasrc implements it by setting the sensor's HFLIP/VFLIP, which on this driver
# turns the image upside down. (It was required on 7.0.0-34 and earlier.)
VIDEOSRC=icamerasrc buffer-count=7
FORMAT=NV12
WIDTH=1280
HEIGHT=720
FRAMERATE=30/1
CARD_LABEL=Intel MIPI Camera
